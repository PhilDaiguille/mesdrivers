name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Tests réseau (Catalogue, GitHub)
        run: cargo test -- --ignored
      - run: cargo build --release

      # Test réel : le moteur complet (WMI + Windows Update + Catalogue) tourne sur le runner.
      - name: Démarrer Windows Update sur le runner
        shell: pwsh
        run: |
          Set-Service wuauserv -StartupType Manual
          Start-Service wuauserv
      - name: Test réel --scan
        run: target\release\mesdrivers.exe --scan
      - name: Test réel --catalog (Intel Wi-Fi connu)
        run: target\release\mesdrivers.exe --catalog "PCI\VEN_8086&DEV_51F1"
      - name: Test réel --catalog-get (téléchargement + SHA-1 + extraction, sans installer)
        run: target\release\mesdrivers.exe --catalog-get "PCI\VEN_8086&DEV_51F1" "$env:RUNNER_TEMP\cat"
      - name: Test réel --backup (export des pilotes tiers du runner)
        run: target\release\mesdrivers.exe --backup "$env:RUNNER_TEMP\sauvegarde"
      - name: Empreinte SHA-256 (vérifiée par la mise à jour automatique)
        shell: pwsh
        run: |
          $h = (Get-FileHash target\release\mesdrivers.exe -Algorithm SHA256).Hash.ToLower()
          "$h  mesdrivers.exe" | Out-File -Encoding ascii -NoNewline target\release\mesdrivers.exe.sha256
          Get-Content target\release\mesdrivers.exe.sha256

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/mesdrivers.exe
            target/release/mesdrivers.exe.sha256
          generate_release_notes: true
