[package]
name = "mesdrivers"
version = "0.3.0"
edition = "2024"
description = "Détection et mise à jour des pilotes Windows via Windows Update (TUI)"
license = "MIT"

[dependencies]
ratatui = "0.30"
sha1_smol = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
wmi = "0.18"
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_UpdateAgent",
] }

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
